server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:webybook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyForWebYBook123456}
    expiration-ms: 86400000
    issuer: webybook

  password-reset:
    token-ttl-minutes: 15
    reset-url: http://localhost:5173/reset-password

  mail:
    enabled: false
    from: no-reply@webybook.vn

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173